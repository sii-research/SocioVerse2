{
  "study_id": "campus_dining_choice",
  "title": "Dining choice and satisfaction of university-town students as canteen and delivery prices rise month by month",
  "research_question": "As the campus canteen raises meal prices month by month and local food delivery also gets more expensive over the same period, how will the main dining mode (canteen / food delivery / cooking for oneself) and consumer satisfaction of about 150 university students evolve month by month?",
  "hypothesis": "As canteen and delivery prices rise month by month, students gradually shift from delivery to the canteen, and then partly to cooking for themselves to contain food spending; mean satisfaction falls as the value for money of the available options declines, and low-budget / price-sensitive students show the largest shifts and the steepest drop in satisfaction.",
  "title_i18n": {
    "zh": "大学城学生在食堂逐月涨价与外卖同步涨价下的就餐选择与满意度演化",
    "en": "Dining choice and satisfaction of university-town students as canteen and delivery prices rise month by month"
  },
  "research_question_i18n": {
    "zh": "当校园食堂逐月上调餐价、本地外卖同期也在涨价时,约150名大学生的主要就餐方式(食堂/点外卖/自己做饭)与消费满意度将如何逐月演变?",
    "en": "As the campus canteen raises meal prices month by month and local food delivery also gets more expensive over the same period, how will the main dining mode (canteen / food delivery / cooking for oneself) and consumer satisfaction of about 150 university students evolve month by month?"
  },
  "hypothesis_i18n": {
    "zh": "随食堂与外卖价格逐月上涨,学生逐步从外卖转向食堂、再部分转向自己做饭以控制餐饮支出;平均满意度随可选项性价比下降而走低,低预算/价格敏感者转移与满意度下滑最明显。",
    "en": "As canteen and delivery prices rise month by month, students gradually shift from delivery to the canteen, and then partly to cooking for themselves to contain food spending; mean satisfaction falls as the value for money of the available options declines, and low-budget / price-sensitive students show the largest shifts and the steepest drop in satisfaction."
