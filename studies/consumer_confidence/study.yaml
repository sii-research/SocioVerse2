{
  "study_id": "consumer_confidence",
  "title": "US Consumer Confidence Forecast via ConsumerSim",
  "research_question": "Forecast monthly consumer confidence from a fixed SocioVerse population and point-in-time information.",
  "hypothesis": "Consumer confidence responds to contemporaneous news and indicators, with group-level uncertainty propagated through Bayesian expansion.",
  "title_i18n": {
    "zh": "基于 ConsumerSim 的美国消费者信心预测（参考模板）",
    "en": "US Consumer Confidence Forecast via ConsumerSim (reference template)"
  },
  "research_question_i18n": {
    "zh": "给定一个固定的 SocioVerse 人群池与某一时点可得的新闻/指标信息，能否预测该月的美国消费者信心指数？当同一目标月内信息随 as_of 逐步累积时，预测如何随之更新？",
    "en": "Given a fixed SocioVerse population pool and the news/indicator information available at a point in time, can we forecast that month's US consumer confidence? And how does the forecast update as information accrues across as_of cutoffs within the same target month?"
  },
  "hypothesis_i18n": {
    "zh": "消费者信心对当期新闻与宏观指标作出反应：由 LLM 预测的分层核心样本捕捉信息冲击，群体层面的不确定性再经贝叶斯扩展传播到未抽样人群；随着利好新闻（油价回落）在月内累积，前瞻性分项与修正后总分应随之抬升。",
    "en": "Consumer confidence responds to contemporaneous news and macro indicators: an LLM-predicted stratified core absorbs the information shock, group-level uncertainty is then propagated to the unsampled pool by Bayesian expansion; as favorable news (easing gas prices) accrues within the month, the forward-looking components and the corrected score should rise."
  },
  "study_type": "longitudinal",
