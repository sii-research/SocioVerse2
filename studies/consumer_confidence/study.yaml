  "metric_descriptions": {
    "corrected_score": "Corrected overall consumer-confidence score (Conference-Board-style index scale, ~90–105): the final forecast after raw_score is corrected by a regression on the previous month's forecast error — this study's headline output.",
    "raw_score": "Uncorrected raw overall confidence score: the weighted aggregate of the five sub-scores, reflecting the immediate signal of the LLM core forecast + Bayesian expansion.",
    "combined_score": "Combined information-environment score (weighted mean of news sentiment and macro indicators, clipped to [-3, 3]): the strength of the exogenous information shock that shifts the core sample's answer distribution.",
    "news_score": "Point-in-time-safe news sentiment score (news published before as_of, weighted by relevance): the main driver of within-month change as information accumulates.",
    "score_future_finance": "Forward-looking sub-score — confidence in one's future personal finances (one of five_business/finance): the sub-score that should rise first as good news accumulates.",
    "score_current_finance": "Confidence score for current personal finances.",
    "score_durable_buying": "Confidence score for buying conditions for durable goods.",
    "score_business_12m": "Confidence score for business conditions over the next 12 months.",
    "score_business_5y": "Confidence score for business conditions over the next 5 years.",
    "news_count": "Number of news items in the information set at the current as_of (after point-in-time-safe filtering): a direct view of the accumulation process.",
    "indicator_count": "Number of macro indicators in the information set at the current as_of.",
    "population_size": "Total size of the population pool (fixed; the same agents tracked in the panel).",
    "core_size": "Size of the stratified core sample the LLM forecasts directly this step; the rest is covered by Bayesian expansion.",
    "correction_residual": "Previous month's residual (forecast − actual), the input to the historical correction term.",
    "correction_adjustment": "Correction applied to raw_score (clipped by max_absolute_adjustment).",
    "region": "Target region (US).",
    "target_month": "Target forecast month (2026-06).",
    "as_of": "This step's information cutoff date (the point-in-time safety boundary)."
  },
