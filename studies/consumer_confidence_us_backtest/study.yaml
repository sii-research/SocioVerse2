  },
  "research_question_i18n": {
    "zh": "把消费者信心指数拆成一群有身份的家庭、每月各自作答再聚合，能不能重建出官方后来公布的密歇根大学消费者信心指数（ICS）？逐月的模拟值与事后实测值差多少、方向对不对？",
    "en": "If the consumer confidence index is rebuilt bottom-up — a fixed panel of households each answering the survey month by month, then aggregated — how closely does it track the University of Michigan Index of Consumer Sentiment published afterwards? Month by month: how large is the gap, and is the direction right?"
  },
  "hypothesis_i18n": {
    "zh": "以每月「点时安全」的信息环境为输入的受访者级模拟，逐月预测应落在实测 ICS 的几个指数点以内，且多数月份的环比方向正确；同时受访者面板会显示出总指数掩盖掉的分化——收入、住房产权与就业状态不同的家庭，信心水平长期错开。",
    "en": "A respondent-level simulation driven by each month's point-in-time information set should land within a few index points of the published ICS and get most month-over-month directions right; meanwhile the respondent panel should reveal persistent level gaps by income, housing tenure and employment that the headline index hides."
  },
