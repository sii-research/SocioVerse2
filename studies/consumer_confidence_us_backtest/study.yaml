  "title": "US Consumer Confidence Backtest — ConsumerSim vs the published Michigan ICS",
  "research_question": "Rebuilt bottom-up from a fixed panel of households answering the survey each month, how closely does the simulated consumer confidence index track the University of Michigan Index of Consumer Sentiment actually published afterwards?",
  "hypothesis": "A respondent-level simulation grounded in each month's point-in-time information environment tracks the published index within a few index points and gets the direction of month-over-month change right most of the time, while the respondent panel shows persistent level differences by income, tenure and employment that the headline number hides.",
