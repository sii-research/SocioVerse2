    "en": "After a triggering event (the Supreme Court overturning Roe v. Wade), how does social-media opinion evolve round by round? Can a hybrid simulation — a few LLM-driven core users plus a large rule-based ordinary population — reproduce the collective trajectory actually observed on Twitter?"
